name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: educa-escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/educa-escola
      # Valor descartável só para o CI: assina sessões de teste, nunca sai daqui.
      BETTER_AUTH_SECRET: ci-placeholder-secret-nao-use-em-producao
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm exec biome ci .

      - name: Tipos
        run: pnpm run check-types

      - name: Testes
        run: pnpm run test

      - name: Migrations acompanham o schema
        run: |
          pnpm --filter @educa-escola/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/src/migrations)" ]; then
            echo "::error::O schema mudou sem migration correspondente. Rode 'pnpm run db:generate' e commite o resultado."
            git status --porcelain packages/db/src/migrations
            exit 1
          fi

  # Prova que a imagem de produção constrói, migra o banco e responde.
  #
  # Nada é publicado: quem constrói a imagem que vai ao ar é o Coolify, na VPS,
  # a partir do `Dockerfile` da raiz (build pack Dockerfile). Este job existe
  # para o defeito de imagem aparecer no pull request, e não no deploy.
  imagem:
    name: Imagem migra e responde
    needs: verify
    runs-on: ubuntu-latest

    # Banco descartável para provar que a imagem migra e sobe.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: educa-escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Constrói a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: integra-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: A imagem migra o banco e responde /api/health
        run: |
          docker run -d --name integra --network host \
            -e DATABASE_URL=postgresql://postgres:password@localhost:5432/educa-escola \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-nao-use-em-producao \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            integra-web:ci

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health; then
              echo
              docker logs integra
              exit 0
            fi
            # Migração que falha derruba o container: não adianta esperar.
            if [ "$(docker inspect -f '{{.State.Running}}' integra)" != "true" ]; then
              break
            fi
            sleep 1
          done

          echo "::error::A imagem não ficou saudável."
          docker logs integra
          exit 1
