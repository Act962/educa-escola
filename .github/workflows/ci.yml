name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: educa-escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/educa-escola
      # Valor descartável só para o CI: assina sessões de teste, nunca sai daqui.
      BETTER_AUTH_SECRET: ci-placeholder-secret-nao-use-em-producao
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint e formatação
        run: pnpm exec biome ci .

      - name: Tipos
        run: pnpm run check-types

      - name: Testes
        run: pnpm run test

      - name: Migrations acompanham o schema
        run: |
          pnpm --filter @educa-escola/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/src/migrations)" ]; then
            echo "::error::O schema mudou sem migration correspondente. Rode 'pnpm run db:generate' e commite o resultado."
            git status --porcelain packages/db/src/migrations
            exit 1
          fi

  # Publica a imagem de produção no GHCR e dispara o deploy no Coolify.
  #
  # Só depois do `verify` e só na `main`: pull request nunca publica. A VPS não
  # compila nada — ela baixa exatamente a imagem que passou por aqui.
  publish:
    name: Publica a imagem
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # Banco descartável para provar que a imagem migra e sobe antes de publicar.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: educa-escola
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IMAGE: ghcr.io/act962/integra-web

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `main` é a etiqueta que o Coolify acompanha; `sha-<commit>` é a que
      # fica para rollback — voltar é apontar o Coolify para uma delas.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=main

      - name: Constrói a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          # Carrega localmente em vez de publicar: o teste abaixo precisa
          # rodar a imagem, e só a imagem testada é que sobe.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de camadas entre execuções — é o que evita rebuildar do zero,
          # e não tem relação com o GHCR: vive no cache do GitHub Actions. Com o
          # Dockerfile copiando os manifestos antes do install, um commit que só
          # mexe em código reaproveita a camada de dependências daqui.
          #
          # `mode=max` guarda também as camadas intermediárias (estágio builder).
          # O cache do Actions tem teto de ~10 GB por repositório e sofre
          # evicção; se ele começar a faltar, a alternativa é guardar o cache no
          # próprio GHCR, trocando as duas linhas abaixo por:
          #   cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          #   cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: A imagem migra o banco e responde /api/health
        run: |
          docker run -d --name integra --network host \
            -e DATABASE_URL=postgresql://postgres:password@localhost:5432/educa-escola \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-nao-use-em-producao \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            "$IMAGE:main"

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health; then
              echo
              docker logs integra
              exit 0
            fi
            # Migração que falha derruba o container: não adianta esperar.
            if [ "$(docker inspect -f '{{.State.Running}}' integra)" != "true" ]; then
              break
            fi
            sleep 1
          done

          echo "::error::A imagem não ficou saudável. Ela não será publicada."
          docker logs integra
          exit 1

      - name: Publica no GHCR
        run: docker push --all-tags "$IMAGE"

      # Sem os segredos o passo avisa e passa: a imagem já está publicada, e o
      # CI não deve ficar vermelho enquanto o Coolify ainda não existe.
      - name: Dispara o deploy no Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK/COOLIFY_TOKEN não configurados: imagem publicada, deploy não disparado."
            exit 0
          fi
          curl --fail --silent --show-error --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
