packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
catalog:
  # DECISÃO-JOÃO: a biblioteca de reconhecimento facial da portaria.
  # Quebra se: for trocada depois de a escola cadastrar rostos — descritor de
  #   extrator diferente não se compara, e todo mundo precisa recadastrar.
  # Fiz assim: versão fixa, escolhida para o teste local pedido pelo usuário.
  #   Os pesos do modelo vêm dentro do pacote, sem CDN e sem rede externa.
  # Alternativas: @mediapipe/tasks-vision (mais leve, acelerado por GPU) ·
  #   extrair no servidor, sem lib no navegador.
  "@vladmandic/face-api": 1.7.15
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^26.4.1
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  tailwindcss: ^4.3.3
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  better-auth: 1.7.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  drizzle-orm: ^0.45.2
  vitest: ^5.0.0
  "@testing-library/jest-dom": ^6.9.1
  "@vitest/coverage-v8": ^5.0.0
